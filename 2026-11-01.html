<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新闻简报 2026-11-01</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1c1917;
      --muted: #57534e;
      --card: #fffdf8;
      --line: #e7e0d5;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #d9efe9 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #f0e6d8 0%, transparent 50%),
        var(--bg);
      line-height: 1.55;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    header h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }
    header p { margin: 0; color: var(--muted); }
    .highlights {
      margin: 1.75rem 0 2rem;
      padding: 1.1rem 1.25rem;
      background: var(--card);
      border: 1px solid var(--line);
    }
    .highlights h2 { margin: 0 0 0.6rem; font-size: 1.05rem; color: var(--accent); }
    .highlights ul { margin: 0; padding-left: 1.2rem; }
    .highlights li { margin: 0.35rem 0; }
    .source { margin: 2rem 0; }
    .source h2 {
      font-size: 1.15rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.4rem;
      margin-bottom: 0.9rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 0.9rem 1rem;
      margin: 0.7rem 0;
    }
    .card h3 { margin: 0 0 0.4rem; font-size: 1.02rem; }
    .card p { margin: 0.35rem 0; color: var(--muted); }
    .card .link a { color: var(--accent); }
    footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>每日新闻简报</h1>
      <p>2026-11-01 · NotifyAgent 自动整理</p>
    </header>
    <section class="highlights">
      <h2>今日要点</h2>
      <ul>
        <li>晨报 — s</li>
      </ul>
    </section>
    <section class="source"><h2>Demo</h2>
<article class="card"><h3>晨报</h3><p>s</p><p class="link"><a href="https://x.test" target="_blank" rel="noopener">阅读原文</a></p></article>
</section>
    <footer>本页由本机 NotifyAgent 生成，仅供验证演示。</footer>
  </main>
</body>
</html>
